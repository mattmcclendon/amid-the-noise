name: Refresh scheduled publications

on:
  # Vercel Cron runs daily at 09:00 UTC (1 a.m. PST / 2 a.m. PDT).
  # On Hobby, invocation can occur anywhere within the scheduled hour.
  # Keep manual dispatch available for an on-demand rebuild.
  workflow_dispatch:

jobs:
  deploy:
    name: Rebuild the production site
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel production deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
